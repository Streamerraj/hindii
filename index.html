
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>@Cricmatchstream</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden;font-family:Arial,sans-serif}
#player-container{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#000}
#status{position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;z-index:9997;display:flex;align-items:center;gap:7px;padding:6px 15px;background:rgba(10,10,10,.88);font-size:12px;border-radius:24px;opacity:0;pointer-events:none;color:#ddd}
#status.show{opacity:1}
.st-dot{width:7px;height:7px;border-radius:50%;background:#60a5fa}
#status.live .st-dot{background:#22d3a0}
#status.warn .st-dot{background:#fb923c}
#status.err .st-dot{background:#f87171}
.sp-fit-btn{background:transparent!important;border:none!important;padding:0 7px!important;color:white!important;cursor:pointer}
.fit-pill{font-size:10px;font-weight:bold;padding:4px 7px;border:1px solid #aaa;border-radius:4px;color:white}
.shaka-controls-container button{color:#fff!important}
.shaka-video-container{background:#000!important}

/* Telegram popup */
.telegram-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.82);backdrop-filter:blur(6px)}
.telegram-popup{width:100%;max-width:350px;padding:28px 22px;text-align:center;color:#fff;background:#111827;border:1px solid #263449;border-radius:18px;box-shadow:0 15px 50px #0009}
.telegram-icon{width:62px;height:62px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#229ED9;font-size:32px}
.telegram-popup h2{margin-bottom:10px;font-size:22px}
.telegram-popup p{margin-bottom:22px;color:#cbd5e1;font-size:14px;line-height:1.6}
.telegram-popup a,.telegram-popup button{display:block;width:100%;padding:13px;border:0;border-radius:10px;font-size:15px;font-weight:bold;text-decoration:none;cursor:pointer}
.telegram-popup a{margin-bottom:10px;color:white;background:#229ED9}
.telegram-popup button{color:#e5e7eb;background:#273244}
.telegram-name{color:#38bdf8;font-weight:bold}
</style>
</head>

<body>

<div id="player-container">
  <video id="video" autoplay muted playsinline preload="metadata"></video>
</div>

<div id="status"><span class="st-dot"></span><span id="statusText">Live</span></div>

<!-- Telegram popup -->
<div id="telegramOverlay" class="telegram-overlay">
  <div class="telegram-popup">
    <div class="telegram-icon">✈</div>
    <h2>Join Our Telegram</h2>
    <p>Join <span class="telegram-name">@cricmatchstream</span> for live links and updates.</p>
    <a href="https://t.me/cricmatchstream" target="_blank" rel="noopener noreferrer">JOIN CHANNEL</a>
    <button id="closePopup">ALREADY JOINED</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

<script>
(function(){
"use strict";

const CONFIG={
  streamUrl:"https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/WDVLive/index.mpd",
  drmKeys:[
    "a1ce6b9514f35174bda80ddd425bfd88:5c5e158724eced92f92ca8286fb28fd9",
    "dd2fa604afc45e528f8a2283bf3cb628:bf01e6e8ff74797fb5215fead779e8b9",
    "209975f6753d5de1ac26d604dace5313:1c54093eff75aeeccd30ebbc53c0e5a3",
    "7bdccdb3dd015c37a0c3bd70675c8e4c:6f1b59376090d1f7ce33cbd264e87c36",
    "11073b8f426e5092a2effada3bfaf721:5d1c59a8052956bd056810f260161e5f"
  ],
  cookieUrl:"https://allrounder2-0.pages.dev/api/Hindi.json"
};

const video=document.getElementById("video");
const container=document.getElementById("player-container");
const statusEl=document.getElementById("status");
const statusText=document.getElementById("statusText");

document.getElementById("closePopup").addEventListener("click",function(){
  document.getElementById("telegramOverlay").style.display="none";
});

function setStatus(message,type,duration){
  statusText.textContent=message;
  statusEl.className="show "+(type||"live");
  if(setStatus.timer)clearTimeout(setStatus.timer);
  if(duration!==0){
    setStatus.timer=setTimeout(()=>statusEl.classList.remove("show"),duration||4000);
  }
}

function buildClearKeys(keys){
  const result={};
  keys.forEach(pair=>{
    const i=pair.indexOf(":");
    if(i>0)result[pair.slice(0,i).trim()]=pair.slice(i+1).trim();
  });
  return result;
}

function injectFitButton(){
  const panel=container.querySelector(".shaka-controls-button-panel");
  if(!panel||panel.querySelector(".sp-fit-btn"))return !!panel;

  const button=document.createElement("button");
  button.className="sp-fit-btn";
  button.title="Change video fit";
  button.innerHTML='<span class="fit-pill">FIT</span>';

  const modes=["contain","fill","cover"];
  const labels=["FIT","FILL","ZOOM"];
  let index=0;

  button.addEventListener("click",event=>{
    event.stopPropagation();
    index=(index+1)%modes.length;
    video.style.objectFit=modes[index];
    button.querySelector(".fit-pill").textContent=labels[index];
  });

  const fullscreen=panel.querySelector(".shaka-fullscreen-button");
  if(fullscreen)panel.insertBefore(button,fullscreen);
  else panel.appendChild(button);
  return true;
}

async function initPlayer(){
  try{
    shaka.polyfill.installAll();

    if(!shaka.Player.isBrowserSupported()){
      setStatus("Browser Not Supported","err",0);
      return;
    }

    const player=new shaka.Player();
    await player.attach(video);

    const ui=new shaka.ui.Overlay(player,container,video);
    ui.configure({
      addBigPlayButton:true,
      controlPanelElements:[
        "play_pause","mute","time_and_duration","spacer",
        "quality","picture_in_picture","fullscreen"
      ],
      seekBarColors:{
        base:"#828282",
        buffered:"#ffc336",
        played:"#1fc7ff"
      }
    });

    let attempts=0;
    const buttonTimer=setInterval(()=>{
      if(injectFitButton()||++attempts>=20)clearInterval(buttonTimer);
    },150);

    player.configure({
      drm:{clearKeys:buildClearKeys(CONFIG.drmKeys)},
      manifest:{defaultPresentationDelay:5},
      streaming:{
        lowLatencyMode:true,
        bufferingGoal:10,
        rebufferingGoal:2,
        safeSeekOffset:5
      }
    });

    let cookieValue="";
    try{
      const response=await fetch(CONFIG.cookieUrl,{cache:"no-store"});
      if(!response.ok)throw new Error("Cookie request failed");
      const data=await response.json();
      cookieValue=data.cookie||"";
    }catch(error){
      console.warn("Cookie request failed.");
    }

    if(cookieValue){
      player.getNetworkingEngine().registerRequestFilter((type,request)=>{
        request.headers=request.headers||{};
        request.headers["Cookie"]=cookieValue;

        const isMedia=
          type===shaka.net.NetworkingEngine.RequestType.MANIFEST||
          type===shaka.net.NetworkingEngine.RequestType.SEGMENT;

        if(isMedia&&request.uris&&request.uris[0]&&
           !request.uris[0].includes("__hdnea__")){
          const token=cookieValue.startsWith("__hdnea__=")
            ?cookieValue.slice(10):cookieValue;
          request.uris[0]+=(request.uris[0].includes("?")?"&":"?")+"__hdnea__="+token;
        }
      });
    }

    player.addEventListener("error",event=>{
      setStatus("Stream error: "+(event.detail.code||""),"err",5000);
    });

    setStatus("Loading…","warn",0);
    await player.load(CONFIG.streamUrl);
    setStatus("Live","live",4000);
    video.play().catch(()=>{});

    video.addEventListener("play",()=>{video.muted=false;});
    container.addEventListener("pointerdown",()=>{video.muted=false;},{once:true});

  }catch(error){
    console.error("Player initialization failed:",error);
    setStatus("Player initialization failed","err",0);
  }
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",initPlayer);
}else{
  initPlayer();
}
})();
</script>

</body>
</html>
