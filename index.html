<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="referrer" content="no-referrer">

<title>TG_@Cricmatchstream</title>

<script>
(function(s){
    s.dataset.zone='11621694';
    s.src='https://al5sm.com/tag.min.js'
})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))
</script>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/shaka-player.ui.min.js"></script>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/controls.min.css"
>

<style>

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}

.shaka-video-container {
    width: 100%;
    height: 100%;
    background: #000;
}

#videoPlayer {
    width: 100%;
    height: 100%;
    background: #000;
    object-fit: contain;
}


/* =========================
   TELEGRAM POPUP
========================= */

.telegram-overlay {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(5px);
}

.telegram-popup {
    width: 100%;
    max-width: 380px;
    box-sizing: border-box;
    padding: 28px 22px 22px;
    text-align: center;
    color: #fff;
    background: #111827;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: popupIn 0.3s ease;
}

@keyframes popupIn {
    from {
        opacity: 0;
        transform: scale(0.88);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.telegram-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: #229ED9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
}

.telegram-popup h2 {
    margin: 0 0 10px;
    font-size: 22px;
}

.telegram-popup p {
    margin: 0 0 22px;
    color: #cbd5e1;
    font-size: 14px;
    line-height: 1.5;
}

.telegram-name {
    color: #38bdf8;
    font-weight: 700;
}

.telegram-buttons {
    display: flex;
    gap: 10px;
    flex-direction: column;
}

.telegram-btn {
    width: 100%;
    border: 0;
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    box-sizing: border-box;
}

.join-btn {
    color: #fff;
    background: #229ED9;
}

.join-btn:hover {
    background: #168ac0;
}

.already-btn {
    color: #e5e7eb;
    background: #273244;
}

.already-btn:hover {
    background: #344154;
}

</style>

</head>

<body>

<div
    id="videoContainer"
    class="shaka-video-container"
>

    <video
        id="videoPlayer"
        playsinline
        autoplay
        muted
    ></video>

</div>


<!-- TELEGRAM POPUP -->

<div
    id="telegramOverlay"
    class="telegram-overlay"
>

    <div class="telegram-popup">

        <div class="telegram-icon">
            ✈
        </div>

        <h2>Join Our Telegram</h2>

        <p>
            Join
            <span class="telegram-name">@cricmatchstream</span>
            for more live links and updates.
        </p>

        <div class="telegram-buttons">

            <a
                class="telegram-btn join-btn"
                href="https://t.me/cricmatchstream"
                target="_blank"
                rel="noopener noreferrer"
            >
                JOIN NOW
            </a>

            <button
                class="telegram-btn already-btn"
                onclick="closeTelegramPopup()"
            >
                ALREADY JOINED
            </button>

        </div>

    </div>

</div>


<script>

const STREAM_URL =
    "https://jiotvpllive.cdn.jio.com//bpk-tv/Star_Sports_HD1_Hindi_BTS/WDVLive/index.mpd";


const DRM_KEYS =
    "a1ce6b9514f35174bda80ddd425bfd88:5c5e158724eced92f92ca8286fb28fd9,dd2fa604afc45e528f8a2283bf3cb628:bf01e6e8ff74797fb5215fead779e8b9,209975f6753d5de1ac26d604dace5313:1c54093eff75aeeccd30ebbc53c0e5a3,7bdccdb3dd015c37a0c3bd70675c8e4c:6f1b59376090d1f7ce33cbd264e87c36,11073b8f426e5092a2effada3bfaf721:5d1c59a8052956bd056810f260161e5f";


const COOKIE_JSON_URL =
    "https://sonujson-v4.pages.dev/Data/sports.json";


const CHANNEL_ID =
    "H1HD";


const videoElement =
    document.getElementById(
        "videoPlayer"
    );


const videoContainer =
    document.getElementById(
        "videoContainer"
    );


let player;
let ui;


function parseDrmKeys(value) {

    const clearKeys = {};

    const pairs =
        String(value || "")
            .split(",")
            .map(
                pair =>
                    pair.trim()
            )
            .filter(Boolean);


    for (
        const pair of pairs
    ) {

        const separator =
            pair.indexOf(":");


        if (
            separator === -1
        ) {

            console.warn(
                "Invalid DRM pair:",
                pair
            );

            continue;
        }


        const kid =
            pair
                .slice(
                    0,
                    separator
                )
                .trim()
                .toLowerCase();


        const key =
            pair
                .slice(
                    separator + 1
                )
                .trim()
                .toLowerCase();


        if (
            !kid ||
            !key
        ) {

            continue;
        }


        clearKeys[kid] =
            key;

    }


    return clearKeys;
}


async function getCookie() {

    const response =
        await fetch(
            COOKIE_JSON_URL,
            {
                method: "GET",
                cache: "no-store"
            }
        );


    if (
        !response.ok
    ) {

        throw new Error(
            "Cookie JSON request failed: " +
            response.status
        );

    }


    const data =
        await response.json();


    if (
        !data ||
        !Array.isArray(
            data.channels
        )
    ) {

        throw new Error(
            "Invalid JSON format."
        );

    }


    const channel =
        data.channels.find(
            item =>
                String(
                    item.id || ""
                )
                    .trim()
                    .toLowerCase() ===
                CHANNEL_ID
                    .toLowerCase()
        );


    if (!channel) {

        throw new Error(
            "Channel not found: " +
            CHANNEL_ID
        );

    }


    const cookie =
        String(
            channel.cookie || ""
        ).trim();


    if (!cookie) {

        throw new Error(
            "Cookie not found for " +
            CHANNEL_ID
        );

    }


    return cookie;
}


function configureStreamRequests(
    cookie
) {

    if (!cookie) {
        return;
    }


    const networkingEngine =
        player.getNetworkingEngine();


    if (!networkingEngine) {
        return;
    }


    networkingEngine.registerRequestFilter(
        (type, request) => {

            if (
                !request.uris ||
                !request.uris[0]
            ) {

                return;
            }


            request.headers =
                request.headers || {};


            request.headers["Cookie"] =
                cookie;


            const url =
                request.uris[0];


            if (
                (type === 0 || type === 1) &&
                !url.includes(
                    "__hdnea="
                ) &&
                !url.includes(
                    "__hdnea__"
                ) &&
                !url.includes(
                    "hdnts="
                )
            ) {

                request.uris[0] =
                    url +
                    (
                        url.includes("?")
                            ? "&"
                            : "?"
                    ) +
                    cookie;

            }

        }
    );
}


function configureDrm() {

    const clearKeys =
        parseDrmKeys(
            DRM_KEYS
        );


    player.configure({

        drm: {
            clearKeys:
                clearKeys
        },

        manifest: {
            defaultPresentationDelay: 5
        },

        streaming: {
            lowLatencyMode: true,
            bufferingGoal: 10,
            rebufferingGoal: 2,
            safeSeekOffset: 5
        }

    });
}


async function initPlayer() {

    try {

        shaka.polyfill.installAll();


        if (
            !shaka.Player
                .isBrowserSupported()
        ) {

            throw new Error(
                "This browser does not support Shaka Player."
            );

        }


        player =
            new shaka.Player();


        await player.attach(
            videoElement
        );


        ui =
            new shaka.ui.Overlay(
                player,
                videoContainer,
                videoElement
            );


        ui.configure({

            controlPanelElements: [
                "play_pause",
                "time_and_duration",
                "mute",
                "volume",
                "spacer",
                "quality",
                "picture_in_picture",
                "fullscreen"
            ]

        });


        player.addEventListener(
            "error",
            event => {

                console.error(
                    "Shaka Player Error:",
                    event.detail
                );

            }
        );


        const cookie =
            await getCookie();


        configureStreamRequests(
            cookie
        );


        configureDrm();


        await player.load(
            STREAM_URL
        );


        try {

            await videoElement.play();

        } catch (error) {

            console.log(
                "Autoplay blocked."
            );

        }


    } catch (error) {

        console.error(
            "Player initialization failed:",
            error
        );

    }

}


function closeTelegramPopup() {

    const overlay =
        document.getElementById(
            "telegramOverlay"
        );

    if (overlay) {
        overlay.style.display = "none";
    }

}


initPlayer();


window.addEventListener(
    "beforeunload",
    () => {

        if (player) {

            player.destroy()
                .catch(
                    () => {}
                );

        }

    }
);

</script>

</body>
</html>
